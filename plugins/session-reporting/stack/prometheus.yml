global:
  # Claude Code exports metrics every 10s with the env below, so scraping
  # faster than that just duplicates points.
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: otel-collector
    honor_labels: true
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: otel-collector-self
    static_configs:
      - targets: ["otel-collector:8888"]
